name: Update Meraki changelogs
 
# The community site blocks programmatic access, so the scheduled scrape is retired.
# apps_script/Code.gs relays the board's subscription emails into inbox/, and a push there
# runs ingest_emails.py. fetch_meraki_changelogs.py is kept for its parser and --reparse.
on:
  push:
    branches: [main]
    paths:
      - "inbox/**"
      - ingest_emails.py
      - fetch_meraki_changelogs.py
      - .github/workflows/update-changelogs.yml
  workflow_dispatch:
    inputs:
      reparse:
        description: "Re-run the parser over the HTML already stored (no network)"
        type: boolean
        default: false
 
permissions:
  contents: write
 
concurrency:
  group: update-changelogs
  cancel-in-progress: false
 
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Ingest relayed emails
        run: |
          mkdir -p inbox
          python3 ingest_emails.py --inbox inbox --out firmware
 
      - name: Reparse stored HTML
        if: ${{ inputs.reparse }}
        run: |
          python3 fetch_meraki_changelogs.py --reparse
          python3 - <<'PY'
          import json
          idx = json.load(open("firmware/index.json"))
          open("firmware/versions.txt", "w").write("\n".join(sorted(idx)) + "\n")
          PY
 
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A firmware
          git add -A inbox 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          n=$(git diff --cached --name-only | grep -c '^firmware/[A-Z]*/.*\.json$' || true)
          git commit -m "Update firmware changelogs from email ($n version files changed)"
          git pull --rebase
          git push
 
